<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Whac a Mole</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Whac a Mole</h1>

    <div class="stats">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Time left</span><strong id="time-left">60</strong></div>
    </div>

    <button id="start" type="button">Start</button>

    <div class="grid">
        <button class="square" type="button" aria-label="Hole 1"></button>
        <button class="square" type="button" aria-label="Hole 2"></button>
        <button class="square" type="button" aria-label="Hole 3"></button>
        <button class="square" type="button" aria-label="Hole 4"></button>
        <button class="square" type="button" aria-label="Hole 5"></button>
        <button class="square" type="button" aria-label="Hole 6"></button>
        <button class="square" type="button" aria-label="Hole 7"></button>
        <button class="square" type="button" aria-label="Hole 8"></button>
        <button class="square" type="button" aria-label="Hole 9"></button>
    </div>

    <script src="app.js"></script>
</body>

</html>
